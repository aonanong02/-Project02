
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Bakery | Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #58b9e9;
    --lightblue: #e1f5ff;
    --pink: #ff91bd;
    --darkpink: #df639f;
    --text: #5c7183;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
    font-family: 'Prompt', sans-serif;
    color: var(--text);
    background: linear-gradient(135deg,#e4f7ff,#fff0f7,#e5f6ff,#ffe5f1);
    background-size: 300% 300%;
    animation: backgroundMove 18s ease-in-out infinite;
    min-height: 100vh;
    overflow-x: hidden;
}

@keyframes backgroundMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.decor {
    position: fixed;
    color: #ff91bd;
    opacity: .35;
    font-size: 24px;
    pointer-events: none;
    z-index: -1;
    animation: floatDecor 5s ease-in-out infinite;
}

.decor.one { top: 15%; left: 5%; }
.decor.two { top: 55%; right: 7%; animation-delay: 1.5s; }
.decor.three { bottom: 12%; left: 12%; animation-delay: 2.5s; }

@keyframes floatDecor {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

header {
    text-align: center;
    padding: 65px 20px;
    background:
        radial-gradient(circle at 20% 20%,#ffffffaa,transparent 30%),
        linear-gradient(120deg,#8edcff,#ffc2dc);
    border-radius: 0 0 45px 45px;
    box-shadow: 0 8px 25px #91cde633;
    position: relative;
    overflow: hidden;
}

header h1 {
    font-size: clamp(32px,6vw,55px);
    color: white;
    text-shadow: 2px 4px 8px #d66f9c55;
    animation: titleAppear 1.5s ease both;
}

header p {
    color: white;
    font-size: 16px;
    margin-top: 10px;
    animation: titleAppear 2s ease both;
}

@keyframes titleAppear {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

nav {
    position: sticky;
    top: 10px;
    z-index: 100;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 15px;
    margin: 15px auto;
    width: fit-content;
    max-width: 95%;
    background: #ffffffdc;
    backdrop-filter: blur(12px);
    border-radius: 50px;
    box-shadow: 0 5px 20px #8dbbd533;
}

nav button {
    border: none;
    background: transparent;
    padding: 10px 22px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    transition: background .5s ease,color .5s ease;
}

nav button:hover,
nav button.active {
    background: linear-gradient(120deg,var(--blue),var(--pink));
    color: white;
}

.page {
    display: none;
    padding: 35px 7%;
}

.page.active {
    display: block;
    animation: pageAppear .8s ease;
}

@keyframes pageAppear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 35px;
    max-width: 1150px;
    margin: 25px auto 60px;
}

.hero-text h2 {
    color: var(--darkpink);
    font-size: clamp(27px,4vw,42px);
    margin-bottom: 15px;
}

.hero-text p {
    line-height: 2;
    font-size: 16px;
}

.hero-text .main-btn { margin-top: 22px; }

.main-btn {
    display: inline-block;
    border: none;
    background: linear-gradient(120deg,var(--blue),var(--pink));
    color: white;
    padding: 13px 28px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: transform .4s ease,box-shadow .4s ease;
    box-shadow: 0 5px 15px #ee9fc155;
}

.main-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px #ee9fc177;
}

.hero-gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.hero-gallery img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 22px;
    box-shadow: 0 6px 18px #8bbbd544;
    transition: transform .6s ease;
    animation: gentleFloat 4s ease-in-out infinite;
}

.hero-gallery img:nth-child(2) { animation-delay: 1s; }
.hero-gallery img:nth-child(3) { animation-delay: 2s; }
.hero-gallery img:nth-child(4) { animation-delay: 3s; }

@keyframes gentleFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.hero-gallery img:hover { transform: scale(1.04); }

.title {
    text-align: center;
    color: var(--darkpink);
    font-size: clamp(25px,4vw,35px);
    margin: 30px 0 35px;
}

.features {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 22px;
    max-width: 1100px;
    margin: 0 auto 70px;
}

.feature-card {
    background: #ffffffd9;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 7px 20px #8bbbd522;
    transition: transform .5s ease,box-shadow .5s ease;
}

.feature-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px #e99fbe44;
}

.feature-card .emoji {
    font-size: 42px;
    margin-bottom: 12px;
}

.feature-card h3 {
    color: var(--darkpink);
    margin-bottom: 8px;
}

.filter-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}

.filter-buttons button {
    border: 2px solid #ffd1e4;
    background: white;
    color: var(--darkpink);
    padding: 10px 22px;
    border-radius: 25px;
    font-family: inherit;
    cursor: pointer;
    transition: background .4s ease,color .4s ease;
}

.filter-buttons button:hover,
.filter-buttons button.active {
    background: linear-gradient(120deg,var(--blue),var(--pink));
    color: white;
    border-color: transparent;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
    max-width: 1200px;
    margin: auto;
}

.food-card {
    background: #ffffffed;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 6px 20px #8bbbd533;
    transition: transform .5s ease,box-shadow .5s ease;
    animation: cardAppear .8s ease both;
}

@keyframes cardAppear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.food-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px #e99fbe55;
}

.food-card.hide { display: none; }

.food-card img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    transition: transform .7s ease;
}

.food-card:hover img { transform: scale(1.04); }

.food-info { padding: 20px; }

.food-info h3 {
    color: var(--darkpink);
    font-size: 19px;
    margin-bottom: 8px;
}

.food-info p {
    font-size: 14px;
    line-height: 1.7;
}

.like-btn {
    margin-top: 15px;
    border: none;
    background: #fff0f6;
    color: var(--darkpink);
    padding: 9px 16px;
    border-radius: 25px;
    font-family: inherit;
    cursor: pointer;
    transition: background .4s ease,transform .4s ease;
}

.like-btn:hover {
    background: #ffd7e8;
    transform: scale(1.03);
}

.like-btn.pop { animation: likePop .4s ease; }

@keyframes likePop {
    50% { transform: scale(1.1); }
}

footer {
    margin-top: 70px;
    padding: 30px 15px;
    text-align: center;
    background: linear-gradient(120deg,#a6e3ff,#ffc5df);
    color: white;
    border-radius: 35px 35px 0 0;
    line-height: 2;
}

@media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2,1fr); }
    .hero
